<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>projectcsi400</title>
    <style>
      .app-loader {
        position: fixed;
        inset: 0;
        z-index: 19000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 24px 16px;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        background:
          radial-gradient(circle at 20% 15%, rgba(96, 165, 250, 0.16), transparent 45%),
          radial-gradient(circle at 80% 85%, rgba(37, 99, 235, 0.08), transparent 45%),
          linear-gradient(135deg, #eef5ff 0%, #ffffff 55%, #e8f2ff 100%);
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }

      .app-loader.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .app-loader.is-leaving .app-loader-spinner {
        transform: scale(0.92);
        transition: transform 0.25s ease;
      }

      .app-loader-spinner {
        position: relative;
        width: 84px;
        height: 84px;
      }

      .app-loader-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid #e3edfb;
        border-top-color: #2563eb;
        border-right-color: #60a5fa;
        animation: app-loader-spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }

      .app-loader-ring.is-inner {
        inset: 12px;
        border-width: 2px;
        border-color: #edf3fc;
        border-bottom-color: #93c5fd;
        animation-duration: 1.4s;
        animation-direction: reverse;
      }

      .app-loader-core {
        position: absolute;
        inset: 24px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        border: 1px solid #e8eff8;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
        color: #2563eb;
      }

      .app-loader-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        text-align: center;
      }

      .app-loader-title {
        font-size: 16px;
        font-weight: 700;
        color: #0f2b52;
      }

      .app-loader-sub {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        color: #8aa0b8;
      }

      .app-loader-dots {
        display: inline-flex;
        gap: 3px;
        margin-left: 2px;
      }

      .app-loader-dots span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #60a5fa;
        animation: app-loader-bounce 1.2s ease-in-out infinite;
      }

      .app-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
      .app-loader-dots span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes app-loader-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes app-loader-bounce {
        0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-3px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loader-ring { animation-duration: 2.4s; }
        .app-loader-dots span { animation: none; opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader" role="status" aria-live="polite">
        <div class="app-loader-spinner" aria-hidden="true">
          <div class="app-loader-ring"></div>
          <div class="app-loader-ring is-inner"></div>
          <div class="app-loader-core">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 10.5 12 3l9 7.5" />
              <path d="M5 9.5V21h14V9.5" />
              <path d="M10 21v-6h4v6" />
            </svg>
          </div>
        </div>
        <div class="app-loader-text">
          <div class="app-loader-title">กำลังโหลดระบบ</div>
          <div class="app-loader-sub">กรุณารอสักครู่<span class="app-loader-dots"><span></span><span></span><span></span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
