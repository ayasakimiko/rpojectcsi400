# Include these locations in the existing HTTPS server for backend.ayasakimioweb.com.
# They bypass the Node gateway and keep TLS on the existing public origin.

location ^~ /__api/direct/auth/ {
    rewrite ^/__api/direct/auth(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

