x-service-env: &service-env
  DB_HOST: db
  DB_PORT: 3306
  DB_USER: ${DB_USER:-root}
  DB_PASSWORD: ${DB_PASSWORD:-rootpass}
  DB_NAME: ${DB_NAME:-projectcsi400}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-4}
  PARKING_CAPACITY: ${PARKING_CAPACITY:-}
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  CLIENT_URL: ${CLIENT_URL:-}
  RDCW_CLIENT_ID: ${RDCW_CLIENT_ID:-}
  RDCW_CLIENT_SECRET: ${RDCW_CLIENT_SECRET:-}
  NODE_OPTIONS: --max-old-space-size=96 --max-semi-space-size=1
  UV_THREADPOOL_SIZE: 2
  TZ: Asia/Bangkok

x-market-db-env: &market-db-env
  MARKET_DB_USER: ${MARKET_DB_USER:-market}
  MARKET_DB_PASSWORD: ${MARKET_DB_PASSWORD:-market-dev-password}

x-upload-env: &upload-env
  <<: *service-env
  NODE_OPTIONS: --max-old-space-size=160 --max-semi-space-size=1

services:
  db:
    image: mysql:8.0
    container_name: projectcsi400-mysql
    restart: unless-stopped
    command:
      - --default-time-zone=+07:00
      - --skip-name-resolve
      - --performance-schema=OFF
      - --max-connections=60
      - --table-open-cache=128
      - --table-open-cache-instances=1
      - --table-definition-cache=400
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --temptable-max-ram=16M
      - --thread-cache-size=8
      - --host-cache-size=0
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-32M}
      - --innodb-log-buffer-size=4M
      - --innodb-adaptive-hash-index=OFF
      - --innodb-read-io-threads=1
      - --innodb-write-io-threads=1
      - --innodb-page-cleaners=1
      - --innodb-purge-threads=1
      - --key-buffer-size=1M
      - --mysqlx=OFF
      - --event-scheduler=OFF
      - --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      TZ: Asia/Bangkok
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectcsi400-migrate
    command: ["node", "Database/migrate.js"]
    restart: "no"
    environment:
      <<: [*service-env, *market-db-env]
      NODE_OPTIONS: --max-old-space-size=192 --max-semi-space-size=1
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: projectcsi400-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    volumes:
      - ./docker/phpmyadmin/mpm_prefork.conf:/etc/apache2/mods-available/mpm_prefork.conf:ro
      - ./docker/phpmyadmin/low-memory.ini:/usr/local/etc/php/conf.d/zz-low-memory.ini:ro
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectcsi400-gateway
    command: ["node", "server.js"]
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 4000
      CLIENT_URL: ${CLIENT_URL:-}
      AUTH_SERVICE_URL: http://auth-service:4001
      ROOM_SERVICE_URL: http://room-service:4002
      CUSTOMER_SERVICE_URL: http://customer-service:4003
      STAFF_SERVICE_URL: http://staff-service:4004
      ADMIN_SERVICE_URL: http://admin-service:4005
      OWNER_SERVICE_URL: http://owner-service:4006
      PARCEL_SERVICE_URL: http://parcel-service:4007
      MAINTENANCE_SERVICE_URL: http://maintenance-service:4008
      PAYMENT_SERVICE_URL: http://payment-service:4009
      MARKET_SERVICE_URL: http://market-service:4010
      NODE_OPTIONS: --max-old-space-size=48 --max-semi-space-size=1
      UV_THREADPOOL_SIZE: 1
      TZ: Asia/Bangkok
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      - auth-service
      - room-service
      - customer-service
      - staff-service
      - admin-service
      - owner-service
      - parcel-service
      - maintenance-service
      - payment-service
      - market-service

  auth-service: &service-defaults
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectcsi400-auth
    command: ["node", "services/authService.js"]
    restart: unless-stopped
    environment:
      <<: *upload-env
      AUTH_PORT: 4001
    ports:
      - "${AUTH_PORT:-4001}:4001"
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  room-service:
    <<: *service-defaults
    container_name: projectcsi400-room
    command: ["node", "services/roomService.js"]
    environment:
      <<: *service-env
      ROOM_PORT: 4002
    ports:
      - "${ROOM_PORT:-4002}:4002"
    volumes: []

  customer-service:
    <<: *service-defaults
    container_name: projectcsi400-customer
    command: ["node", "services/customerService.js"]
    environment:
      <<: *upload-env
      CUSTOMER_PORT: 4003
    ports:
      - "${CUSTOMER_PORT:-4003}:4003"
    volumes:
      - ./public/uploads:/app/public/uploads

  staff-service:
    <<: *service-defaults
    container_name: projectcsi400-staff
    command: ["node", "services/staffService.js"]
    environment:
      <<: *upload-env
      STAFF_PORT: 4004
    ports:
      - "${STAFF_PORT:-4004}:4004"
    volumes:
      - ./public/uploads:/app/public/uploads

  admin-service:
    <<: *service-defaults
    container_name: projectcsi400-admin
    command: ["node", "services/adminService.js"]
    environment:
      <<: *upload-env
      ADMIN_PORT: 4005
    ports:
      - "${ADMIN_PORT:-4005}:4005"
    volumes:
      - ./public/uploads:/app/public/uploads

  owner-service:
    <<: *service-defaults
    container_name: projectcsi400-owner
    command: ["node", "services/ownerService.js"]
    environment:
      <<: *service-env
      OWNER_PORT: 4006
    ports:
      - "${OWNER_PORT:-4006}:4006"
    volumes: []

  parcel-service:
    <<: *service-defaults
    container_name: projectcsi400-parcel
    command: ["node", "services/parcelService.js"]
    environment:
      <<: *upload-env
      PARCEL_PORT: 4007
    ports:
      - "${PARCEL_PORT:-4007}:4007"
    volumes:
      - ./public/uploads:/app/public/uploads

  maintenance-service:
    <<: *service-defaults
    container_name: projectcsi400-maintenance
    command: ["node", "services/maintenanceService.js"]
    environment:
      <<: *upload-env
      MAINTENANCE_PORT: 4008
    ports:
      - "${MAINTENANCE_PORT:-4008}:4008"
    volumes:
      - ./public/uploads:/app/public/uploads

  payment-service:
    <<: *service-defaults
    container_name: projectcsi400-payment
    command: ["node", "services/paymentService.js"]
    environment:
      <<: *upload-env
      PAYMENT_PORT: 4009
    ports:
      - "${PAYMENT_PORT:-4009}:4009"
    volumes:
      - ./public/uploads:/app/public/uploads

  market-service:
    <<: *service-defaults
    container_name: projectcsi400-market
    command: ["node", "services/marketService.js"]
    environment:
      <<: [*service-env, *market-db-env]
      MARKET_PORT: 4010
      AUTH_SERVICE_URL: http://auth-service:4001
      PAYMENT_SERVICE_URL: http://payment-service:4009
    ports:
      - "${MARKET_PORT:-4010}:4010"
    volumes:
      - ./storage/market-contracts:/app/storage/market-contracts
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      payment-service:
        condition: service_started

volumes:
  db_data:
